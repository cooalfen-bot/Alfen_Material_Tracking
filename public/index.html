<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0397dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alfen">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Alfen Site Material</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: drawing-sheet feel. Left rail nav on desktop, bottom bar on phones. Job pages read like a title block over a three-stage rail. */
:root{
  --bg:#edf1f4; --surface:#ffffff; --ink:#18242e; --muted:#586775; --line:#d3dce3; --line-soft:#e4eaef;
  --accent:#0397dc; --accent-ink:#0272ab; --accent-soft:#e1f3fc; --slate:#5b6b78;
  --ok:#1b7f55; --ok-soft:#e1f4ea; --warn:#9a6208; --warn-soft:#fbf0d9; --bad:#b83225; --bad-soft:#fbe5e2;
  --shadow:0 1px 0 rgba(24,36,46,.04);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171d; --surface:#18222a; --ink:#e5ecf1; --muted:#9aabb8; --line:#2c3a45; --line-soft:#232f39;
  --accent:#2fb0ee; --accent-ink:#5cc3f5; --accent-soft:#12303f; --slate:#9aabb8;
  --ok:#4cc58d; --ok-soft:#14302a; --warn:#e3a94b; --warn-soft:#352a14; --bad:#ef7a6e; --bad-soft:#3a1d1a;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#18222a; --ink:#e5ecf1; --muted:#9aabb8; --line:#2c3a45; --line-soft:#232f39;
  --accent:#2fb0ee; --accent-ink:#5cc3f5; --accent-soft:#12303f; --slate:#9aabb8;
  --ok:#4cc58d; --ok-soft:#14302a; --warn:#e3a94b; --warn-soft:#352a14; --bad:#ef7a6e; --bad-soft:#3a1d1a;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.25rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-ink)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--accent);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.plate{background:#fff;border-radius:2px;padding:3px 6px;display:flex;line-height:0}
.plate img{height:34px;width:auto;display:block}
.app-name{font-family:var(--f-display);font-weight:600;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}

/* shell */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:20px 96px;max-width:1240px;margin-inline:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-i{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--muted);
  font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem;cursor:pointer;border-radius:2px}
.nav-i svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.nav-i[aria-current="page"]{color:var(--accent-ink);box-shadow:inset 0 -3px 0 var(--accent)}
.nav.solo{display:none}
.layout.solo{padding-bottom:40px}
@media (min-width:900px){
  .layout{grid-template-columns:190px minmax(0,1fr);gap:36px;padding-bottom:48px}
  .nav{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start;flex-direction:column;gap:2px;background:none;border:0;padding:0}
  .nav-i{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:1rem;justify-content:flex-start;border-radius:2px}
  .nav-i[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
  .nav.solo{display:none}
  .layout.solo{grid-template-columns:minmax(0,1fr)}
}
main{min-width:0;display:flex;flex-direction:column;gap:22px}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--line);background:var(--surface);
  border-radius:2px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04202e}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent-ink);padding:0 4px;min-height:32px;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:600;font-size:.95rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:2px;cursor:pointer;font-size:1.2rem;line-height:1;color:var(--muted)}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.82rem;color:var(--muted)}
.field small{color:var(--muted);font-size:.8rem}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],input[type=datetime-local],select,textarea{
  width:100%;min-height:42px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:2px;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
input.up{text-transform:uppercase}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-weight:600;min-height:1.2em}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h p{margin-top:4px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--slate);padding:12px 14px;text-align:left;cursor:pointer;border-radius:2px}
.tile.t-received{border-top-color:var(--accent)} .tile.t-verified{border-top-color:var(--ok)} .tile.t-issue{border-top-color:var(--bad)}
.tile b{display:block;font-family:var(--f-display);font-size:2.4rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.82rem;color:var(--muted)}

/* pills + steps */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:2px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;white-space:nowrap;background:var(--line-soft);color:var(--muted)}
.pill.booked{background:var(--line-soft);color:var(--slate)}
.pill.received{background:var(--accent-soft);color:var(--accent-ink)}
.pill.verified,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.issue,.pill.damaged,.pill.short{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.steps{display:inline-flex;align-items:center}
.steps i{width:14px;height:14px;border:2px solid var(--line);background:var(--surface);display:block}
.steps i+i{margin-left:12px;position:relative}
.steps i+i::before{content:"";position:absolute;left:-12px;top:4px;width:12px;height:2px;background:var(--line)}
.steps i.on{background:var(--accent);border-color:var(--accent)}
.steps i.on+i::before,.steps i.on+i.on::before{background:var(--accent)}
.steps.good i.on{background:var(--ok);border-color:var(--ok)}
.steps.bad i.on:last-child{background:var(--bad);border-color:var(--bad)}

/* job rows */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 12px;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.88rem;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.jobs{display:flex;flex-direction:column}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line-soft);padding:14px 16px;cursor:pointer;align-items:center}
.job:hover{background:var(--accent-soft)}
.job .no{font-family:var(--f-mono);font-weight:600;font-size:1rem}
.job .site{grid-column:1/-1;min-width:0}
.job .site b{font-weight:600}
.job .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.88rem}
@media (min-width:860px){
  .job{grid-template-columns:130px minmax(0,1fr) 92px 190px 130px;padding:12px 16px}
  .job .site{grid-column:auto}
  .job .meta{grid-column:auto;display:contents}
  .jobs-head{display:grid;grid-template-columns:130px minmax(0,1fr) 92px 190px 130px;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
}
.jobs-head{display:none}
@media (min-width:860px){.jobs-head{display:grid}}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:46ch;color:var(--muted)}

/* attention list */
.att{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line-soft);width:100%;background:none;border-inline:0;border-top:0;text-align:left;cursor:pointer;flex-wrap:wrap}
.att:last-child{border-bottom:0}
.att:hover{background:var(--accent-soft)}

/* title block */
.tb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ink);background:var(--surface)}
@media (min-width:860px){.tb{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tb>div{padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.tb .k{display:block;font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.tb .w2{grid-column:span 2}
.job-h{display:flex;flex-direction:column;gap:8px}
.job-h .no{font-family:var(--f-mono);font-weight:600;font-size:1.7rem;letter-spacing:.02em}
.job-h .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back{align-self:flex-start}

/* stage rail */
.rail{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:36px minmax(0,1fr);gap:0 14px}
.node{display:flex;flex-direction:column;align-items:center}
.node b{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.1rem;font-weight:700;color:var(--muted)}
.node::after{content:"";flex:1;width:2px;background:var(--line);margin:4px 0}
.stage:last-child .node::after{display:none}
.stage.done .node b{background:var(--accent);border-color:var(--accent);color:#04202e}
.stage.done.good .node b{background:var(--ok);border-color:var(--ok);color:#fff}
.stage.done.bad .node b{background:var(--bad);border-color:var(--bad);color:#fff}
.stage.done .node::after{background:var(--accent)}
.stage.current .node b{border-color:var(--accent);color:var(--accent-ink)}
.node svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3}
.st-body{padding-bottom:22px;min-width:0}
.stage:last-child .st-body{padding-bottom:0}
.st-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px;min-height:34px}
.st-h h2{display:flex;align-items:center;min-height:34px}
.st-h time{color:var(--muted);font-size:.88rem}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px;margin-bottom:12px}
.kvs .k{display:block;font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.kvs div{min-width:0;overflow-wrap:anywhere}
.pending{color:var(--muted);border:1px dashed var(--line);padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who-photo{display:flex;gap:12px;align-items:center}
.portrait{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);display:block;background:var(--line-soft)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{padding:0;border:1px solid var(--line);background:var(--line-soft);cursor:zoom-in;aspect-ratio:1;overflow:hidden;border-radius:2px;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.busy::after{content:"Uploading";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:.8rem;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:2px;cursor:pointer;line-height:1}
.nophoto{color:var(--muted);font-size:.9rem}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.94rem}
.tbl th{font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.78rem;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .sub{display:block;color:var(--muted);font-size:.85rem}
.items-ed td{padding:4px 4px}
.items-ed input{min-height:38px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
fieldset{border:1px solid var(--line);background:var(--surface);margin:0;padding:0;min-width:0}
legend{float:left;width:100%;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--line-soft);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.9rem;color:var(--muted)}
legend+*{clear:both}
.fs-b{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fs-b .full{grid-column:1/-1}
.pf-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pf-grid:empty{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem;color:var(--muted);border-right:1px solid var(--line);background:var(--surface)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label.g:has(input:checked){background:var(--ok);color:#fff}
.seg label.r:has(input:checked){background:var(--bad);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.vrow{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:grid;gap:8px}
.vrow:last-child{border-bottom:0}
.vrow .vd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vrow input[type=text]{min-height:36px}
.formbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 16px;border-bottom:1px solid var(--line-soft);font-size:.92rem}
.log li:last-child{border-bottom:0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.log li{grid-template-columns:1fr;gap:2px}}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);padding:24px}
.auth-card .plate{align-self:flex-start;padding:0;border-radius:0}
.auth-card .plate img{height:56px}

/* additions */
.hdr-home{min-height:36px;padding:0 12px}
.hdr-home svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
@media (max-width:560px){.app-name,.who-name,.who .pill{display:none}.plate img{height:30px}}
.probs{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.probs li{padding:6px 10px;border-left:3px solid var(--bad);background:var(--bad-soft)}
.mgal{padding:16px;display:grid;gap:16px;border-bottom:1px solid var(--line-soft)}
.mgal .lbl{display:block;margin-bottom:6px}
.vrow .check{border:0;padding:0;background:none}
.vrow .check span{min-width:0}
/* lightbox + toast */
#lb{position:fixed;inset:0;z-index:50;background:rgba(6,10,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;background:#000}
#lb p{color:#dfe8ee;font-size:.92rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100vw - 32px);

function stamp(ctx,w,h,text){
  if(!text)return;
  const fs=Math.max(14,Math.round(w/46));ctx.font=`600 ${fs}px "IBM Plex Mono",monospace`;
  const pw=ctx.measureText(text).width+fs;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,h-fs*1.9,pw,fs*1.9);
  ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(text,fs/2,h-fs*.95);
}
async function toBitmap(file){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u});
}
async function compress(file,label){
  const bm=await toBitmap(file);let max=1280,q=.72,blob;
  for(let i=0;i<5;i++){
    const sc=Math.min(1,max/Math.max(bm.width,bm.height));const w=Math.round(bm.width*sc),h=Math.round(bm.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(bm,0,0,w,h);stamp(x,w,h,label);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<150000)break;q=Math.max(.5,q-.06);max=Math.round(max*.85);
  }
  return blob;
}
async function savePhoto(blob){
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
  const r=await api('blob.put',{name:'photo.jpg',type:'image/jpeg',data:url});

}

async function pfAdd(name,files,multi,labelText){
  const arr=S.D.photos[name]=S.D.photos[name]||[];

function parseCsv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function rowsToItems(rows){
  rows=rows.map(r=>r.map(v=>String(v??'').trim())).filter(r=>r.some(Boolean));
  let hi=rows.findIndex(r=>r.some(c=>/desc|item|material|particular|product/i.test(c)));
  let ci={d:0,s:-1,q:1,u:2};
  if(hi>=0){const h=rows[hi];const f=re=>h.findIndex(c=>re.test(c));
    ci={d:f(/desc|item|material|particular|product|name/i),s:f(/size|spec|dimension|colour|color|finish|remark/i),q:f(/qty|quantity|nos|count/i),u:f(/unit|uom/i)};
    if(ci.d<0)ci.d=0;rows=rows.slice(hi+1)}
  return rows.map(r=>({desc:r[ci.d]||'',spec:ci.s>=0?(r[ci.s]||''):'',qty:ci.q>=0?(r[ci.q]||''):'',unit:ci.u>=0?(r[ci.u]||''):'Nos'})).filter(i=>i.desc)
}
async function readList(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'||ext==='txt')return rowsToItems(parseCsv(await file.text()));
  if(typeof XLSX==='undefined')throw new Error('xlsx');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];return rowsToItems(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
}

function attention(){
  const now=Date.now(),out=[];
  for(const j of S.jobs){const s=stageOf(j);
    if(s==='booked'){const ex=j.dispatch.expected;
      if(ex&&now>new Date(ex))out.push([j,`Delivery overdue by ${ago(ex)}`]);
      else if(!ex&&now-new Date(j.dispatch.at)>864e5)out.push([j,`In transit for ${ago(j.dispatch.at)}`])}
    else if(s==='received'&&now-new Date(j.receipt.at)>432e5)out.push([j,`Waiting for fitting team for ${ago(j.receipt.at)}`]);
    else if(s==='issue')out.push([j,'Issues reported at verification']);
    if(j.receipt&&j.receipt.match!=='all'&&s!=='issue')out.push([j,'Receipt issue: '+(MATCH[j.receipt.match]||'check receipt').toLowerCase()]);
  }
  return out.slice(0,6);
}

function filterJobs(){
  const q=S.q.trim().toLowerCase();
  return S.jobs.filter(j=>{
    const s=stageOf(j);
    if(S.f==='booked'&&s!=='booked')return false;
    if(S.f==='received'&&s!=='received')return false;
    if(S.f==='verified'&&s!=='verified')return false;
    if(S.f==='issue'&&!(s==='issue'||flagged(j)))return false;
    if(!q)return true;
    return [j.jobNo,j.client,j.site,j.dispatch.driver,j.dispatch.vehicle,j.receipt?.receiver,j.verification?.team].some(v=>String(v||'').toLowerCase().includes(q));
  });
}

  if(!j)return `<button class="btn link back" data-act="back">← Back</button><div class="panel empty"><h2>Job not found</h2><p>${esc(S.route.id)} is not in the system. It may have been removed.</p></div>`;
  const s=stageOf(j),d=j.dispatch,r=j.receipt,v=j.verification;
  const tick='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const cls1='done',cls2=r?'done'+(j.receipt.match!=='all'?' bad':''):'current',cls3=v?'done '+(v.outcome==='issues'?'bad':'good'):(r?'current':'');
  const nv=r?(v?'':(can.verify(S.me)?'<button class="btn primary" data-act="verify" data-id="'+esc(j.jobNo)+'">Verify materials</button>':'<span class="muted">Waiting for the fitting team to verify.</span>')):'<span class="muted">Starts after the material is received at site.</span>';
  return `<button class="btn link back" data-act="back">← ${S.me.role==='user'?'Track another job':'All jobs'}</button>
  <div class="job-h"><div class="line"><span class="no">${esc(j.jobNo)}</span>${pill(j)}${j.sample?'<span class="pill warn">Sample</span>':''}</div>
    <h1>${esc(j.client)}</h1></div>
  <div class="tb"><div class="w2"><span class="k">Site</span>${esc(j.site)}${j.address?`<br><span class="muted">${esc(j.address)}</span>`:''}</div>
    <div><span class="k">Site contact</span>${j.contact?esc(j.contact):'–'} ${j.contactMobile?'<br>'+tel(j.contactMobile):''}</div>
    <div><span class="k">Material lines</span>${j.items.length}</div>
    <div><span class="k">Vehicle</span><span class="mono">${esc(d.vehicle||'–')}</span></div>
    <div><span class="k">Driver</span>${esc(d.driver)}<br>${tel(d.driverMobile)}</div>
    <div><span class="k">Dispatched</span>${fmt(d.at)}</div>
    <div><span class="k">Expected at site</span>${fmt(d.expected)}</div></div>
  <div class="rail">
    <section class="stage ${cls1}"><div class="node"><b>${tick}</b></div><div class="st-body">
      <div class="st-h"><h2>Booked from factory</h2><time>${fmt(d.at)} · by ${esc(d.by)}</time></div>
      <div class="kvs">${kv('Driver',esc(d.driver)+' · '+tel(d.driverMobile))}${kv('Vehicle',esc(d.vehicle||'–'))}${kv('Expected delivery',fmt(d.expected))}${d.remarks?kv('Remarks',esc(d.remarks)):''}</div>
      ${photoGrid(d.photos,'Loaded at factory')}</div></section>
    <section class="stage ${cls2}"><div class="node"><b>${r?tick:'2'}</b></div><div class="st-body">
      <div class="st-h"><h2>Received at site</h2>${r?`<time>${fmt(r.at)}</time>`:''}</div>
      ${r?receiptDetail(j):
      `<div class="pending"><span>Not received yet.${d.expected?' Expected '+fmt(d.expected)+'.':''}</span>${can.receive(S.me)?'<button class="btn primary" data-act="receive" data-id="'+esc(j.jobNo)+'">Record receipt</button>':''}</div>`}</div></section>
    <section class="stage ${cls3}"><div class="node"><b>${v?tick:'3'}</b></div><div class="st-body">
      <div class="st-h"><h2>Verified by fitting team</h2>${v?`<time>${fmt(v.at)}</time>`:''}</div>
      ${v?`<div class="kvs">${kv('Fitting team',esc(v.team)+(v.lead?'<br><span class="muted">Lead: '+esc(v.lead)+(v.leadMobile?' · ':'')+'</span>'+tel(v.leadMobile):''))}${kv('Packing before opening','<span class="pill '+(v.packing==='intact'?'ok':'damaged')+'">'+(v.packing==='intact'?'Intact':'Damaged')+'</span>')}${kv('Result','<span class="pill '+(v.outcome==='issues'?'issue':'ok')+'">'+(v.outcome==='issues'?'Issues found':'All verified')+'</span>')}${v.remarks?kv('Remarks',esc(v.remarks)):''}</div>${photoGrid(v.photos,'Verified by fitting team')}`:
      `<div class="pending"><span>Not verified yet.</span>${nv}</div>`}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Material list</h2>${j.listFile?`<a class="btn link" href="${esc(photoSrc(j.listFile.id))}" target="_blank" rel="noopener">Open uploaded list (${esc(j.listFile.name)})</a>`:''}</div>${materialPhotos(j)}${j.items.length?itemsTable(j):'<div class="empty"><p>No items recorded.</p></div>'}</section>
  <section class="panel"><div class="panel-h"><h2>Activity</h2></div><ul class="log">${(j.log||[]).slice().reverse().map(l=>`<li><time>${fmt(l.at)}</time><span>${esc(l.text)} <span class="muted">· ${esc(l.by)}</span></span></li>`).join('')}</ul></section>
  ${can.admin(S.me)?`<div class="formbar" style="justify-content:flex-start">${S.delAsk===j.jobNo?`<button class="btn danger" data-act="del-yes" data-id="${esc(j.jobNo)}">Yes, delete this job</button><button class="btn" data-act="del-no">Keep it</button>`:`<button class="btn danger" data-act="del-ask" data-id="${esc(j.jobNo)}">Delete job</button>`}</div>`:''}`;
}
function itemsEditor(){
  return `<div class="tbl-wrap"><table class="tbl items-ed"><thead><tr><th>#</th><th>Material</th><th>Size / spec</th><th>Qty</th><th>Unit</th><th></th></tr></thead><tbody>${S.D.items.map((it,i)=>`<tr>
    <td class="mono c-n">${i+1}</td>
    <td class="c-desc"><input type="text" data-it="${i}" data-k="desc" value="${esc(it.desc)}" placeholder="e.g. Sliding window, 2-track" aria-label="Material, row ${i+1}"></td>
    <td class="c-spec"><input type="text" data-it="${i}" data-k="spec" value="${esc(it.spec)}" placeholder="e.g. 1500 × 1200 mm, bronze" aria-label="Size or spec, row ${i+1}"></td>
    <td class="c-qty"><input type="text" inputmode="decimal" data-it="${i}" data-k="qty" value="${esc(it.qty)}" placeholder="Qty" aria-label="Quantity, row ${i+1}"></td>
    <td class="c-unit"><select data-it="${i}" data-k="unit" aria-label="Unit, row ${i+1}">${[...new Set([it.unit||'Nos',...UNITS])].map(u=>`<option ${u===(it.unit||'Nos')?'selected':''}>${esc(u)}</option>`).join('')}</select></td>
    <td class="c-x"><button type="button" class="icon-btn" data-act="item-del" data-i="${i}" aria-label="Remove row ${i+1}">×</button></td></tr>`).join('')}</tbody></table></div>`;
}

function summaryBlock(j){
  return `<div class="tb"><div><span class="k">Job</span><span class="mono"><b>${esc(j.jobNo)}</b></span></div><div class="w2"><span class="k">Client and site</span>${esc(j.client)}, ${esc(j.site)}</div><div><span class="k">Driver</span>${esc(j.dispatch.driver)}</div></div>`;
}

      `<div class="row-actions"><button class="btn" data-act="pin-edit" data-m="${esc(u.mobile)}">Reset PIN</button>${u.mobile!==S.me.mobile?`<button class="btn" data-act="user-toggle" data-m="${esc(u.mobile)}">${u.active===false?'Turn on':'Turn off'}</button>`:''}</div>`}</td></tr>`).join('')}</tbody></table></div></section>`;

function activityView(){
  const all=[];S.jobs.forEach(j=>(j.log||[]).forEach(l=>all.push({...l,job:j.jobNo})));
  all.sort((a,b)=>new Date(b.at)-new Date(a.at));
  return `<div class="page-h"><div><h1>Activity</h1><p class="muted">Everything recorded across all jobs, newest first.</p></div></div>
  <section class="panel">${all.length?`<ul class="log">${all.slice(0,150).map(l=>`<li><time>${fmt(l.at)}</time><span><button class="btn link" data-act="open" data-id="${esc(l.job)}"><span class="mono">${esc(l.job)}</span></button> ${esc(l.text)} <span class="muted">· ${esc(l.by)}</span></span></li>`).join('')}</ul>`:'<div class="empty"><p>No activity yet.</p></div>'}</section>`;
}

/* ---------- render ---------- */
const FORMS=['dispatch','receive','verify'];
function view(){
  switch(S.route.name){
    case'dash':return dashView();case'jobs':return jobsView();case'job':return jobView();case'dispatch':return dispatchView();
    case'receive':return receiveView();case'verify':return verifyView();case'team':return teamView();case'activity':return activityView();default:return homeView();
  }
}
function render(){
  const app=$('#app');
  if(S.dataErr&&!S.me){app.innerHTML=errView();return}
  if(!S.me){app.innerHTML=authView();return}
  app.innerHTML=shell(view());hydratePhotos();
}
function go(name,id){
  S.route={name,id};S.delAsk=null;
  if(name==='dispatch')S.D={items:[{desc:'',spec:'',qty:'',unit:'Nos'}],photos:{load:[]},listFile:null};
  if(FORMS.includes(name)&&name!=='dispatch')S.D={items:[],photos:{}};
  if(name==='jobs'&&S.f!=='all'&&S._keepF!==true){}
  render();window.scrollTo(0,0);
}
function homeRoute(){return S.me.role==='user'?'home':'dash'}

/* ---------- data ---------- */
function applyState(r){
  const sig=JSON.stringify([r.jobs,r.users||null,r.me]);
  const same=sig===S.sig;S.sig=sig;
  S.jobs=r.jobs.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(r.users)S.users=r.users;
  S.me=r.me;
  return !same;
}
async function refresh(){
  if(!S.token)return;
  try{if(applyState(await api('state'))&&S.me)onData()}
  catch(e){if(e.status===401){doSignOut();toast('Please sign in again.',true)}}
}
function onData(){
  if(FORMS.includes(S.route.name))return;
  const jl=$('#jobList');
  if(S.route.name==='jobs'&&jl){jl.innerHTML=listHtml();const c=$('#jobCount');if(c)c.textContent=S.jobs.length;return}
  const ae=document.activeElement&&document.activeElement.id;
  if(ae==='lk'||ae==='pinNew'||ae==='jq')return;
  render();
}
function startPolling(){
  clearInterval(S.timer);
  S.timer=setInterval(()=>{if(!document.hidden&&S.me&&!FORMS.includes(S.route.name))refresh()},10000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me&&!FORMS.includes(S.route.name))refresh()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;if(S.me&&!FORMS.includes(S.route.name))render()});
function enter(r){
  S.token=r.token;store.set('alfen.tok',r.token);S.me=r.user;
  startPolling();refresh().then(()=>go(homeRoute()));go(homeRoute());
}
function doSignOut(){
  clearInterval(S.timer);S.token=null;S.me=null;S.jobs=[];S.users=[];S.sig='';S.route={name:'auth'};store.set('alfen.tok',null);render();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  if(e.target.id==='lb'){closeLb();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  switch(a){
    case'nav':go(t.dataset.r);break;
    case'home':go(homeRoute());break;
    case'retry':S.dataErr='';boot();break;
    case'install':if(S.inst){S.inst.prompt();S.inst=null;render()}break;
    case'open':go('job',t.dataset.id);break;
    case'back':go(S.me.role==='user'?'home':'jobs');break;
    case'receive':go('receive',t.dataset.id);break;
    case'verify':go('verify',t.dataset.id);break;
    case'filter':S.f=t.dataset.f;go('jobs');break;
    case'signout':doSignOut();break;
    case'photo':openLb(t.dataset.id,t.dataset.cap);break;
    case'lbclose':closeLb();break;
    case'pf-del':{const arr=S.D.photos[t.dataset.n];arr.splice(+t.dataset.i,1);pfRender(t.dataset.n);break}
    case'item-add':syncItems();S.D.items.push({desc:'',spec:'',qty:'',unit:'Nos'});$('#itemsBox').innerHTML=itemsEditor();break;
    case'item-del':S.D.items.splice(+t.dataset.i,1);if(!S.D.items.length)S.D.items.push({desc:'',spec:'',qty:'',unit:'Nos'});$('#itemsBox').innerHTML=itemsEditor();break;
    case'tpl':downloadFile('alfen-material-list-template.csv','Item,Size / Spec,Qty,Unit\nSliding window 2-track,1500 x 1200 mm bronze,6,Nos\nCasement door,2100 x 900 mm,2,Nos\nHardware kit,Handles and locks,8,Sets\n');break;
    case'mark-ok':document.querySelectorAll('.seg input[value="ok"]').forEach(i=>i.checked=true);break;
    case'export':exportCsv();break;
    case'sample':await addSample();break;
    case'del-ask':S.delAsk=t.dataset.id;render();break;
    case'del-no':S.delAsk=null;render();break;
    case'del-yes':try{await api('job.delete',{jobNo:t.dataset.id});S.delAsk=null;toast('Job deleted.');await refresh();go('jobs')}catch(err){writeErr(err)}break;
    case'pin-edit':S.pinEdit=t.dataset.m;S.pinDraft='';render();setTimeout(()=>$('#pinNew')?.focus(),0);break;
    case'pin-cancel':S.pinEdit=null;render();break;
    case'pin-save':{const pin=($('#pinNew').value||'').trim();if(!/^\d{4,6}$/.test(pin)){toast('PIN must be 4 to 6 digits.',true);break}
      try{await api('user.pin',{mobile:t.dataset.m,pin});S.pinEdit=null;toast('PIN updated.');render()}catch(err){writeErr(err)}break}
    case'user-toggle':{const u=S.users.find(x=>x.mobile===t.dataset.m);if(!u)break;
      try{await api('user.toggle',{mobile:u.mobile});await refresh();render()}catch(err){writeErr(err)}break}
  }
});
function closeLb(){const lb=$('#lb');lb.hidden=true;lb.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('input.up'))t.value=t.value.toUpperCase();
  if(t.id==='jq'){S.q=t.value;$('#jobList').innerHTML=listHtml()}
  if(t.id==='pinNew')S.pinDraft=t.value;
  if(t.dataset&&t.dataset.it!==undefined){S.D.items[+t.dataset.it][t.dataset.k]=t.value}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.it!==undefined&&t.tagName==='SELECT'){S.D.items[+t.dataset.it].unit=t.value}
  if(t.dataset&&t.dataset.pin){
    const name=t.dataset.pin,pf=t.closest('.pf'),multi=pf.dataset.multi==='1';
    const files=[...t.files];t.value='';
    const jobNo=name==='load'?($('#d_no')?.value||''):(S.route.id||'');
    await pfAdd(name,files,multi,()=>`${jobNo?jobNo+'  ':''}${fmt(new Date().toISOString())}`);
  }
  if(t.id==='d_list'&&t.files[0])await onListFile(t.files[0]);
  if(t.id==='lk'&&t.value)go('job',t.value);
  if(t.id==='r_match')toggleProb();
  if(t.id==='r_mode')applyMode();
});
function toggleProb(){const b=$('#probBox');if(b)b.hidden=$('#r_match').value==='all'}
function applyMode(){
  const j=S.jobs.find(x=>x.jobNo===S.route.id);if(!j)return;
  const dm=$('#r_mode').value==='driver';S.D.mode=dm?'driver':'site';
  $('#drvBox').hidden=!dm;$('#whoLegend').textContent=dm?'Delivered by driver':'Received at site by';
  $('#whoPhotoLbl').textContent=dm?'Photo of driver at site':'Photo of receiver';
  $('#r_name').value=dm?j.dispatch.driver:'';$('#r_mob').value=dm?(j.dispatch.driverMobile||''):'';
}
function syncItems(){document.querySelectorAll('[data-it]').forEach(el=>{S.D.items[+el.dataset.it][el.dataset.k]=el.value})}
async function fileToDataUrl(f){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)})}
async function attachFile(f,type){
  if(f.size>700*1024)throw new Error('big');
  const r=await api('blob.put',{name:f.name,type,data:await fileToDataUrl(f)});
  return{id:r.id,name:f.name};
}
async function onListFile(f){
  const st=$('#listStatus'),ext=(f.name.split('.').pop()||'').toLowerCase();
  try{
    if(['csv','xlsx','xls','txt'].includes(ext)){
      const items=await readList(f);
      if(!items.length){st.textContent='No rows found. Check the file has a header row with Item, Qty and Unit, or type the items below.';return}
      S.D.items=items.slice(0,400);$('#itemsBox').innerHTML=itemsEditor();
      st.textContent=`Read ${S.D.items.length} item${S.D.items.length===1?'':'s'} from ${f.name}. Check the rows below.`;
      if(ext==='csv'){try{S.D.listFile=await attachFile(f,'text/csv')}catch(e){}}
    }else if(ext==='pdf'||/^image\//.test(f.type)){
      let file=f,type=ext==='pdf'?'application/pdf':f.type;
      if(type.startsWith('image/')&&f.size>600*1024){file=new File([await compress(f,'')],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});type='image/jpeg'}
      S.D.listFile=await attachFile(file,type);
      st.textContent=`Attached ${f.name}. Type the item rows below so the fitting team can check them one by one.`;
    }else st.textContent='This file type cannot be attached. Upload an Excel or CSV file, or type the items below.';
  }catch(err){st.textContent=err.message==='big'?'That file is over 700 KB. Upload Excel or CSV, or type the items below.':'That file could not be read. Try Excel or CSV, or type the items below.'}
}
function downloadFile(filename,data){
  const blob=new Blob(['\ufeff',data],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportCsv(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Job','Client','Site','Status','Driver','Driver mobile','Vehicle','Dispatched','Received','Received by','Receiver mobile','Unloading team','Verified','Fitting team','Result']];
  S.jobs.forEach(j=>rows.push([j.jobNo,j.client,j.site,STAGE[stageOf(j)],j.dispatch.driver,j.dispatch.driverMobile,j.dispatch.vehicle,fmt(j.dispatch.at),fmt(j.receipt?.at),j.receipt?.receiver,j.receipt?.receiverMobile,j.receipt?.teamName,fmt(j.verification?.at),j.verification?.team,j.verification?(j.verification.outcome==='issues'?'Issues found':'All verified'):'']));
  downloadFile('alfen-jobs.csv',rows.map(r=>r.map(q).join(',')).join('\n'));
}
async function addSample(){
  const no='JO099999',now=new Date();
  const j={jobNo:no,sample:true,client:'Sample client (delete me)',site:'Green Valley Residency, Tower B',address:'Plot 14, Ajmer Road, Jaipur',contact:'Site engineer',contactMobile:'9876500000',
    items:[{desc:'Sliding window, 2-track',spec:'1500 × 1200 mm, bronze anodised',qty:'12',unit:'Nos'},{desc:'Casement door, single leaf',spec:'2100 × 900 mm, wood-finish',qty:'4',unit:'Nos'},{desc:'Fixed glass panel',spec:'900 × 1800 mm, 8 mm toughened',qty:'6',unit:'Nos'},{desc:'Hardware kit',spec:'Handles, locks, rollers',qty:'10',unit:'Sets'}],
    listFile:null,dispatch:{at:now.toISOString(),expected:new Date(now.getTime()+864e5).toISOString(),driver:'Sample driver',driverMobile:'9876511111',vehicle:'RJ14 GA 0000',by:S.me.name,byMobile:S.me.mobile,remarks:'Sample job for trying the app.',photos:[]},
    createdAt:now.toISOString(),updatedAt:now.toISOString(),createdBy:S.me.name,log:[{at:now.toISOString(),by:S.me.name,text:'Sample job added'}]};
  try{await api('job.create',{jobNo:no,job:j});toast('Sample job JO099999 added.');await refresh();go('job',no)}catch(err){writeErr(err)}
}

document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='authForm')return doAuth();
  if(id==='lookupForm'){const no=$('#lk').value;
    if(!no){$('#lkErr').textContent='Choose a job from the list.';return}
    go('job',no);return}
  if(id==='dispatchForm')return saveDispatch();
  if(id==='receiveForm')return saveReceipt();
  if(id==='verifyForm')return saveVerify();
  if(id==='userForm')return saveUser();
});
function formErr(msg,focus){const el=$('#formErr');el.textContent=msg;if(focus){const f=document.getElementById(focus);f&&f.focus()}else el.scrollIntoView({block:'center'});return false}
function busy(on){const b=$('#saveBtn');if(b){b.disabled=on}}

async function doAuth(){
  const err=$('#authErr'),btn=$('#authBtn');err.textContent='';
  const m=mob($('#a_mob').value),pin=($('#a_pin').value||'').trim();
  if(!okMob(m)){err.textContent='Enter a 10-digit mobile number.';return}
  if(!/^\d{4,6}$/.test(pin)){err.textContent='PIN must be 4 to 6 digits.';return}
  btn.disabled=true;
  try{
    let r;
    if(S.needSetup){
      const name=($('#a_name').value||'').trim();if(!name){err.textContent='Enter your name.';btn.disabled=false;return}
      r=await api('setup',{name,mobile:m,pin});S.needSetup=false;
    }else r=await api('login',{mobile:m,pin});
    enter(r);
  }catch(ex){
    if(ex.code==='no_storage'){S.dataErr='no_storage';render();return}
    err.textContent=ex.status&&ex.status<500?ex.message:'Could not reach the server. Check your connection and try again.';btn.disabled=false;
  }
}
async function saveUser(){
  const name=$('#u_name').value.trim(),m=mob($('#u_mob').value),role=$('#u_role').value,func=$('#u_func').value,pin=$('#u_pin').value.trim();
  if(!name)return formErr('Enter a name.','u_name');
  if(!okMob(m))return formErr('Enter a 10-digit mobile number.','u_mob');
  if(!/^\d{4,6}$/.test(pin))return formErr('PIN must be 4 to 6 digits.','u_pin');
  if(S.users.some(u=>u.mobile===m))return formErr('That mobile number is already registered.','u_mob');
  try{await api('user.add',{name,mobile:m,role,func,pin});toast(`${name} added as ${ROLE[role]}.`);$('#userForm').reset();$('#formErr').textContent='';await refresh();render()}catch(err){writeErr(err)}
}
async function saveDispatch(){
  syncItems();const v=id=>($('#'+id).value||'').trim();
  const no=v('d_no').toUpperCase();
  if(!REG.test(no))return formErr('Job number must be in the format JO0XXXXX, for example JO012345.','d_no');
  if(S.jobs.some(j=>j.jobNo===no))return formErr(`${no} already exists. Open it from the Jobs page.`,'d_no');
  if(!v('d_client'))return formErr('Enter the client name.','d_client');
  if(!v('d_site'))return formErr('Enter the site or project name.','d_site');
  const cm=mob(v('d_cmob'));if(cm&&!okMob(cm))return formErr('Site contact mobile must be 10 digits.','d_cmob');
  const items=S.D.items.map(i=>({desc:i.desc.trim(),spec:i.spec.trim(),qty:String(i.qty).trim(),unit:i.unit||'Nos'})).filter(i=>i.desc);
  if(!items.length)return formErr('Add at least one material item, or upload the list.');
  if(items.some(i=>!i.qty))return formErr('Every item needs a quantity.');
  if(!v('d_drv'))return formErr('Enter the driver name.','d_drv');
  const dm=mob(v('d_dmob'));if(!okMob(dm))return formErr('Driver mobile must be 10 digits.','d_dmob');
  if(!v('d_at'))return formErr('Enter the dispatch date and time.','d_at');
  if(photosBusy())return formErr('Photos are still uploading. Wait a moment and save again.');
  const ph=photoIds('load');if(!ph.length)return formErr('Add at least one photo of the material loaded.');
  const now=new Date().toISOString();
  const job={client:v('d_client'),site:v('d_site'),address:v('d_addr'),contact:v('d_contact'),contactMobile:cm,items,listFile:S.D.listFile||null,
    dispatch:{at:new Date(v('d_at')).toISOString(),expected:v('d_exp')?new Date(v('d_exp')).toISOString():'',driver:v('d_drv'),driverMobile:dm,vehicle:v('d_veh').toUpperCase(),by:S.me.name,byMobile:S.me.mobile,remarks:v('d_rem'),photos:ph},
    createdAt:now,updatedAt:now,createdBy:S.me.name,log:[{at:now,by:S.me.name,text:`Booked from factory. Driver ${v('d_drv')}, ${items.length} item${items.length===1?'':'s'}, ${ph.length} photo${ph.length===1?'':'s'}`}]};
  busy(true);
  try{await api('job.create',{jobNo:no,job});toast(`${no} booked.`);await refresh();go('job',no)}catch(err){busy(false);writeErr(err)}
}
async function saveReceipt(){
  const j=S.jobs.find(x=>x.jobNo===S.route.id);const v=id=>($('#'+id).value||'').trim();
  const mode=S.D.mode==='driver'?'driver':'site',dm=mode==='driver';
  if(!v('r_at'))return formErr('Enter when the material was delivered.','r_at');
  if(!v('r_name'))return formErr(dm?'Enter the driver name.':'Enter the name of who received the material.','r_name');
  const rm=mob(v('r_mob'));if(!okMob(rm))return formErr('Mobile number must be 10 digits.','r_mob');
  if(photosBusy())return formErr('Photos are still uploading. Wait a moment and save again.');
  const who=photoIds('who');if(!who.length)return formErr(dm?'Add a photo of the driver at site.':'Add a photo of the person who received the material.');
  if(dm){if(!v('r_reason'))return formErr('Say why no site person was available.','r_reason');if(!v('r_left'))return formErr('Say where or with whom the material was left.','r_left')}
  if(!v('r_team'))return formErr('Enter the unloading team name.','r_team');
  const cnt=parseInt(v('r_cnt'),10);if(!(cnt>0))return formErr('Enter how many people were in the unloading team.','r_cnt');
  if(!$('#r_conf').checked)return formErr('The unloading team must confirm before you can save.');
  const ph=photoIds('rcv');if(!ph.length)return formErr('Add at least one photo of the material at site.');
  const match=$('#r_match').value;const problems=[];
  if(match!=='all'){
    j.items.forEach((it,i)=>{if($('#rp'+i)&&$('#rp'+i).checked)problems.push({i,note:($('#rn'+i).value||'').trim()})});
    if(!problems.length)return formErr('Tick the items that are missing or damaged.');
    if(!v('r_rem'))return formErr('Add a remark that explains what is missing or damaged.','r_rem');
  }
  const now=new Date().toISOString();
  const receipt={mode,at:new Date(v('r_at')).toISOString(),receiver:v('r_name'),receiverMobile:rm,photo:who[0],reason:dm?v('r_reason'):'',leftAt:dm?v('r_left'):'',teamName:v('r_team'),teamCount:cnt,teamLead:v('r_lead'),confirmed:true,match,problems,remarks:v('r_rem'),photos:ph,by:S.me.name,byMobile:S.me.mobile};
  busy(true);
  try{await api('job.receipt',{jobNo:j.jobNo,receipt});toast('Receipt saved.');await refresh();go('job',j.jobNo)}catch(err){busy(false);writeErr(err)}
}
async function saveVerify(){
  const j=S.jobs.find(x=>x.jobNo===S.route.id);const v=id=>($('#'+id).value||'').trim();
  if(!v('v_team'))return formErr('Enter the fitting team name.','v_team');
  if(!v('v_lead'))return formErr('Enter the team lead name.','v_lead');
  const lm=mob(v('v_mob'));if(lm&&!okMob(lm))return formErr('Lead mobile must be 10 digits.','v_mob');
  const items=[];
  for(let i=0;i<j.items.length;i++){const c=document.querySelector(`input[name="vi${i}"]:checked`);
    if(!c)return formErr(`Choose OK, Damaged or Short for item ${i+1}.`);
    items.push({r:c.value,note:($('#vn'+i).value||'').trim()})}
  if(photosBusy())return formErr('Photos are still uploading. Wait a moment and save again.');
  const ph=photoIds('ver');if(!ph.length)return formErr('Add at least one photo of the material as verified.');
  if(!$('#v_conf').checked)return formErr('Confirm that the material was verified before opening the packing.');
  const packing=$('#v_pack').value;const issues=packing!=='intact'||items.some(i=>i.r!=='ok');
  const now=new Date().toISOString();
  const verification={at:now,team:v('v_team'),lead:v('v_lead'),leadMobile:lm,packing,items,outcome:issues?'issues':'ok',remarks:v('v_rem'),photos:ph,by:S.me.name,byMobile:S.me.mobile};
  busy(true);
  try{await api('job.verify',{jobNo:j.jobNo,verification});toast('Verification saved.');await refresh();go('job',j.jobNo)}catch(err){busy(false);writeErr(err)}
}

/* ---------- boot ---------- */
async function boot(){
  render();
  S.token=store.get('alfen.tok');
  try{
    if(S.token){
      try{applyState(await api('state'));startPolling();go(homeRoute());return}
      catch(e){if(e.status!==401)throw e;S.token=null;store.set('alfen.tok',null)}
    }
    S.needSetup=(await api('status')).needSetup;
  }catch(e){S.dataErr=e.code==='no_storage'?'no_storage':'offline'}
  render();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script>
